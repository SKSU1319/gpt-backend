<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnHub Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .card { background: #1e293b; max-width: 600px; margin: 30px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .wallet { font-size: 32px; font-weight: bold; color: #22c55e; margin: 15px 0; }
    .user-info { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    iframe { width: 100%; height: 550px; border: none; border-radius: 8px; background: #ffffff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Earn Dashboard</h2>
    <div class="user-info">User ID: <b id="uid">user_101</b></div>
    <div class="wallet">$<span id="bal">0.00</span></div>

    <!-- Offerwall Frame -->
    <iframe id="wall" src=""></iframe>
  </div>

  <script>
    const currentUserId = "user_101";
    const backendUrl = "https://gpt-backend-zh2q.onrender.com";

    async function updateBalance() {
      try {
        const res = await fetch(`${backendUrl}/api/user/${currentUserId}`);
        const data = await res.json();
        document.getElementById('bal').innerText = Number(data.balance).toFixed(2);
      } catch (e) {
        console.log("Fetching balance error:", e);
      }
    }

    updateBalance();
    setInterval(updateBalance, 8000);
  </script>
</body>
</html>
